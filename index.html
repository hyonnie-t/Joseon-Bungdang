<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>조선 붕당 분화 시뮬레이션</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="seal" aria-hidden="true">儒</span>
        <div>
          <h1>나라면 어떻게 할까?</h1>
        </div>
      </div>
      <button type="button" class="btn ghost" id="glossaryBtn">📖 용어 사전</button>
    </div>
    <div class="progress" id="progress" hidden>
      <div class="progress-row">
        <span id="progressName"></span>
        <span id="progressCount"></span>
      </div>
      <div class="bar"><div class="bar-fill" id="progressFill"></div></div>
    </div>
  </header>

  <div class="preview-banner" id="previewBanner" hidden>미리보기야. 여기서 쓴 내용은 저장되지 않아.</div>

  <main class="wrap">
    <!-- 0. 시작 -->
    <section id="screenIntro" class="card center">
      <div id="introImg"></div>
      <h2 class="serif big">“나라를 위한 최선의 길은 무엇인가?”</h2>
      <p class="lead">
        다섯 번의 갈림길에서 그 시대 사람이 되어,
        <strong>당시 역사적 맥락에서 최선이라고 생각하는 선택</strong>을 해 봐.
        장면마다 맡는 역할이 달라서, 앞의 선택이 다음 장면으로 이어지지는 않아.
      </p>
      <p class="note">장면 속 대사는 실제 대화 기록이 아니라, 배경 설명을 대화 형태로 바꾼 창작이야.</p>

      <form class="login" id="loginForm" autocomplete="off">
        <label>학번 <span class="hint-inline">5자리 (예: 30512)</span>
          <input id="sidInput" inputmode="numeric" maxlength="5" placeholder="학번 5자리">
        </label>
        <label>이름
          <input id="nameInput" maxlength="20" placeholder="이름">
        </label>
        <p class="error" id="loginError" role="alert" hidden></p>
        <button type="submit" class="btn primary big-btn">시작하기</button>
      </form>
    </section>

    <!-- 1. 장면 -->
    <section id="screenSim" hidden>
      <div id="bridgeSlot"></div>
      <div class="card" id="stageCard"></div>
    </section>

    <!-- 2. 결과 -->
    <section id="screenSummary" class="card" hidden></section>

    <!-- 3. 글쓰기 -->
    <section id="screenWriting" class="card" hidden></section>
  </main>

  <!-- 용어 사전 -->
  <div class="modal" id="glossaryModal" hidden role="dialog" aria-modal="true" aria-labelledby="glossaryTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="glossaryTitle">📖 용어 사전</h3>
        <button type="button" class="btn ghost small" data-close="glossaryModal">닫기</button>
      </div>
      <div class="modal-body" id="glossaryBody"></div>
    </div>
  </div>

  <!-- 자료 돋보기 -->
  <div class="modal" id="magnifierModal" hidden role="dialog" aria-modal="true" aria-labelledby="magTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="magTitle">🔍 자료 돋보기</h3>
        <button type="button" class="btn ghost small" data-close="magnifierModal">닫기</button>
      </div>
      <div class="modal-body" id="magnifierBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- 로딩 순서: 설정 → 콘텐츠 → 순수 로직 → 화면. init()은 app.js 맨 마지막에서 호출한다. -->
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
